<header class="bg-light">
  <nav class="navbar navbar-expand bg-body-tertiary">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">{{ title }}</a>

      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/recipes" routerLinkActive="active">
            Recipes
          </a>
        </li>
      </ul>

      <div ngbDropdown class="dropdown ms-auto">
        <button class="btn btn-light" type="button" ngbDropdownToggle aria-haspopup="true" aria-expanded="false">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        <ul ngbDropdownMenu class="dropdown-menu dropdown-menu-end">
          <li>
            <button class="dropdown-item" type="button" (click)="importData()">
              <i class="bi bi-file-earmark-arrow-down me-2"></i>
              Import data ...
            </button></li>
          <li>
            <button class="dropdown-item" type="button" (click)="exportData()">
              <i class="bi bi-file-earmark-arrow-up me-2"></i>
              Export data ...
            </button>
          </li>
        </ul>
      </div>

    </div>
  </nav>
</header>

<main role="main" class="container-fluid mt-4 mb-4">
  <router-outlet></router-outlet>
</main>


<footer class="footer mt-auto py-3 bg-light">
  <div class="container text-center">
    <span class="text-muted">&copy; 2023 My Application</span>
  </div>
</footer>
